version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # NGINX Production Reverse Proxy & API Gateway Entry
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: exam_oracle_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api-gateway

  # ----------------------------------------------------------------------------
  # PostgreSQL Relational Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: exam_oracle_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exam_oracle_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oracle_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-exam_oracle_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exam_oracle_admin} -d ${POSTGRES_DB:-exam_oracle_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis In-Memory Cache & Token Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: exam_oracle_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_password_2026}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Qdrant Vector Database
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.8.2
    container_name: exam_oracle_qdrant
    restart: always
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-qdrant_secure_api_key_2026}
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # MinIO S3-Compatible Object Storage
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-07T00-13-43Z
    container_name: exam_oracle_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_admin_user}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_admin_password_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # RabbitMQ Message Broker
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: exam_oracle_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-oracle_mq_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mq_secure_password_2026}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # MLflow MLOps Tracking Server & Model Registry
  # ----------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    container_name: exam_oracle_mlflow
    restart: always
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow-artifacts --host 0.0.0.0
    volumes:
      - mlflow_data:/mlflow-artifacts

  # ----------------------------------------------------------------------------
  # Python FastAPI AI Microservice
  # ----------------------------------------------------------------------------
  ai-engine:
    build:
      context: ./apps/ai-engine
      dockerfile: Dockerfile
    container_name: exam_oracle_ai_engine
    restart: always
    environment:
      - PORT=8000
      - QDRANT_HOST=qdrant
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - MINIO_ENDPOINT=minio
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # NestJS API Gateway Microservice
  # ----------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    container_name: exam_oracle_api_gateway
    restart: always
    environment:
      - PORT=4000
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - AI_ENGINE_URL=http://ai-engine:8000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_started

  # ----------------------------------------------------------------------------
  # Next.js Web Frontend Application
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: exam_oracle_web
    restart: always
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  rabbitmq_data:
  mlflow_data:
